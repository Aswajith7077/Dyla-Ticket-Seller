services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  naive-store:
    image: ghcr.io/aswajith7077/dyla-ticket-seller-naive-store:latest
    pull_policy: always
    build:
      context: ./naive-store
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    restart: unless-stopped
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  optimized-store:
    image: ghcr.io/aswajith7077/dyla-ticket-seller-optimized-store:latest
    pull_policy: always
    build:
      context: ./optimized-store
      dockerfile: Dockerfile
    ports:
      - "8002:8000"
    restart: unless-stopped
    environment:
      - PORT=8000
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: ghcr.io/aswajith7077/dyla-ticket-seller-frontend:latest
    pull_policy: always
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
        NEXT_PUBLIC_NAIVE_URL: http://localhost:8001
        NEXT_PUBLIC_OPTIMIZED_URL: http://localhost:8002
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - NEXT_PUBLIC_NAIVE_URL=http://localhost:8001
      - NEXT_PUBLIC_OPTIMIZED_URL=http://localhost:8002
    depends_on:
      - naive-store
      - optimized-store
