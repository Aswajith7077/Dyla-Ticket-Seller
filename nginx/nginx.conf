events {
    worker_connections 1024;
}

http {
    upstream optimized_cluster {
        least_conn;
        server optimized-store-1:8000;
        server optimized-store-2:8000;
        server optimized-store-3:8000;
    }

    server {
        listen 8003;

        location / {
            proxy_pass http://optimized_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header X-Served-By $upstream_addr always;
            # Custom response headers aren't readable by browser JS via
            # fetch() unless explicitly exposed under CORS — without this,
            # res.headers.get("X-Served-By") on the frontend always returns
            # null even though the header is physically in the response.
            add_header Access-Control-Expose-Headers "X-Served-By" always;
        }
    }
}
